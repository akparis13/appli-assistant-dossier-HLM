<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clé de dossier — Assistant logement social</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{
  --navy:#16243F; --navy-2:#20335A; --navy-3:#0F1A30;
  --paper:#F6F4EE; --paper-2:#FFFFFF; --ink:#1A1E27; --ink-soft:#5B6270;
  --ochre:#B9812B; --ochre-ink:#7A551A;
  --teal:#2F7A6B; --teal-bg:#E4F0EC;
  --clay:#B4472E; --clay-bg:#F7E7E2;
  --line:#DDD8CB; --line-soft:#EAE7DE;
  --radius:10px;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --navy:#0F1A30; --navy-2:#1B2C4C; --navy-3:#0A1220;
    --paper:#14181F; --paper-2:#1C212B; --ink:#EAE8E2; --ink-soft:#A9ADB6;
    --line:#2A2F3A; --line-soft:#232833;
    --teal-bg:#16332C; --clay-bg:#3A2019;
  }
}
:root[data-theme="dark"]{
  --navy:#0F1A30; --navy-2:#1B2C4C; --navy-3:#0A1220;
  --paper:#14181F; --paper-2:#1C212B; --ink:#EAE8E2; --ink-soft:#A9ADB6;
  --line:#2A2F3A; --line-soft:#232833;
  --teal-bg:#16332C; --clay-bg:#3A2019;
}
html{scroll-padding-top: env(safe-area-inset-top, 0px);}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Public Sans', system-ui, -apple-system, sans-serif;
  font-size:15px; line-height:1.55;
}
h1,h2,h3,h4{font-family:'Source Serif 4', Georgia, serif; font-weight:600; margin:0 0 .4em; line-height:1.2;}
p{margin:.3em 0 .8em;}
a{color:var(--navy-2);}
:root[data-theme="dark"] a, :root:not([data-theme="light"]) a { color:#8CA9E0; }
button{font-family:inherit; cursor:pointer;}
::selection{background:var(--ochre); color:#fff;}
:focus-visible{outline:2px solid var(--ochre); outline-offset:2px;}

/* ---- App shell ---- */
#app{display:flex; min-height:100vh;}
.sidebar{
  width:250px; flex:0 0 250px; background:var(--navy); color:#EDEEF3;
  padding:20px 14px calc(20px + env(safe-area-inset-bottom,0px));
  position:sticky; top:0; align-self:flex-start; height:100vh; overflow-y:auto;
  padding-top: calc(20px + env(safe-area-inset-top,0px));
}
.brand{display:flex; align-items:center; gap:10px; padding:4px 8px 18px; border-bottom:1px solid rgba(255,255,255,.12); margin-bottom:14px;}
.brand-mark{width:34px; height:34px; border-radius:8px; background:var(--ochre); display:flex; align-items:center; justify-content:center; font-size:18px; flex:0 0 auto;}
.brand-name{font-family:'Source Serif 4',serif; font-size:16.5px; font-weight:600; color:#fff;}
.brand-sub{font-size:11.5px; color:#B7BFD1;}
nav.steps{display:flex; flex-direction:column; gap:3px;}
.step-btn{
  display:flex; align-items:flex-start; gap:10px; text-align:left; width:100%;
  background:transparent; border:none; color:#D6DAE6; padding:10px 10px; border-radius:8px;
  font-size:13.6px;
}
.step-btn .num{
  flex:0 0 22px; height:22px; width:22px; border-radius:50%; background:rgba(255,255,255,.1);
  display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:600;
  color:#C6CCDD; margin-top:1px;
}
.step-btn .label{font-weight:600; color:#F0F1F5;}
.step-btn .sub{display:block; font-weight:400; color:#9AA2B8; font-size:11.8px; margin-top:1px;}
.step-btn:hover{background:rgba(255,255,255,.06);}
.step-btn.active{background:var(--navy-2);}
.step-btn.active .num{background:var(--ochre); color:#fff;}
.sidebar-foot{margin-top:16px; padding-top:14px; border-top:1px solid rgba(255,255,255,.12); font-size:11.5px; color:#98A0B4;}
.sidebar-foot b{color:#D6DAE6;}
.sidebar-toolbar{margin-bottom:6px;}

main{flex:1; min-width:0; padding:28px 32px calc(60px + env(safe-area-inset-bottom,0px)); max-width:920px;}
.eyebrow-row{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:6px;}
.view-title{font-size:26px;}
.view-lede{color:var(--ink-soft); max-width:64ch; margin-bottom:22px;}

/* ---- Cards / building blocks ---- */
.card{background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin-bottom:16px;}
.card h3{font-size:16.5px;}
.field{margin-bottom:16px;}
.field > label{display:block; font-weight:600; font-size:13.6px; margin-bottom:8px;}
.field .hint{font-weight:400; color:var(--ink-soft); font-size:12.3px; margin-top:4px;}
.choices{display:flex; flex-wrap:wrap; gap:8px;}
.choice{
  border:1px solid var(--line); background:var(--paper); border-radius:999px; padding:8px 14px;
  font-size:13.3px; color:var(--ink); font-weight:500;
}
.choice:hover{border-color:var(--ochre-ink);}
.choice.sel{background:var(--navy); border-color:var(--navy); color:#fff;}
.choice.sel::before{content:"✓ "; }
input[type=text], input[type=number], input[type=date], select, textarea{
  width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--paper-2);
  color:var(--ink); font-family:inherit; font-size:13.8px;
}
textarea{resize:vertical; min-height:70px;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media (max-width:640px){ .grid2{grid-template-columns:1fr;} }

.btn{
  display:inline-flex; align-items:center; gap:7px; border-radius:8px; padding:10px 16px;
  font-size:13.6px; font-weight:600; border:1px solid transparent;
}
.btn-primary{background:var(--navy); color:#fff;}
.btn-primary:hover{background:var(--navy-2);}
.btn-ochre{background:var(--ochre); color:#fff;}
.btn-ghost{background:transparent; border-color:var(--line); color:var(--ink);}
.sidebar .btn-ghost{ color:#F1F2F6; border-color:rgba(255,255,255,.32); background:rgba(255,255,255,.07); }
.sidebar .btn-ghost:hover{ border-color:#fff; background:rgba(255,255,255,.14); }
.btn-ghost:hover{border-color:var(--navy);}
.btn-danger{background:transparent; border-color:var(--clay); color:var(--clay);}
.btn[disabled]{opacity:.45; cursor:not-allowed;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;}

.pill{display:inline-flex; align-items:center; gap:5px; font-size:11.3px; font-weight:700; padding:3px 9px; border-radius:999px; letter-spacing:.2px;}
.pill-et{background:var(--teal-bg); color:var(--teal);}
.pill-ou{background:var(--clay-bg); color:var(--clay); }
.pill-ok{background:var(--teal-bg); color:var(--teal);}
.pill-warn{background:#F5EBD3; color:var(--ochre-ink);}

/* Checklist */
.doc-group{border:1px solid var(--line); border-left:4px solid var(--ink-soft); border-radius:8px; margin-bottom:12px; overflow:hidden; background:var(--paper-2);}
.doc-group.et{border-left-color:var(--teal);}
.doc-group.ou{border-left-color:var(--clay);}
.doc-group-head{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; background:var(--line-soft);}
.doc-group-title{font-weight:700; font-size:14px;}
.doc-opts{padding:8px 14px 12px;}
.doc-opt{display:flex; align-items:flex-start; gap:10px; padding:8px 2px; border-bottom:1px dashed var(--line-soft);}
.doc-opt:last-child{border-bottom:none;}
.doc-opt input[type=checkbox]{margin-top:3px; width:17px; height:17px; accent-color:var(--teal);}
.doc-opt .opt-txt{flex:1;}
.doc-opt .opt-txt .n{font-weight:600; font-size:13.6px;}
.doc-opt .opt-txt .d{font-size:12.2px; color:var(--ink-soft);}
.or-sep{font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--clay); font-weight:700; padding:2px 0 2px 27px;}

.progress-wrap{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
.progress-bar{flex:1; height:9px; background:var(--line-soft); border-radius:999px; overflow:hidden;}
.progress-fill{height:100%; background:var(--teal); border-radius:999px; transition:width .25s;}
.progress-num{font-weight:700; font-size:13px; white-space:nowrap;}

/* Eligibility */
.diag{border-radius:var(--radius); padding:18px 20px; margin-bottom:16px; border:1px solid var(--line);}
.diag.plai{background:var(--teal-bg); border-color:var(--teal);}
.diag.plus{background:#EAF1DA; border-color:#5C7A2E;}
.diag.pls{background:#F5EBD3; border-color:var(--ochre);}
.diag.none{background:var(--clay-bg); border-color:var(--clay);}
.diag h3{margin-bottom:4px;}
table.bareme{width:100%; border-collapse:collapse; font-size:12.6px; margin-top:10px;}
table.bareme th, table.bareme td{border:1px solid var(--line); padding:6px 8px; text-align:right;}
table.bareme th{background:var(--line-soft); text-align:center; font-size:11.8px;}
table.bareme td:first-child, table.bareme th:first-child{text-align:left;}
tr.hl td{background:rgba(185,129,43,.14); font-weight:700;}

/* Vault */
.doc-list{display:flex; flex-direction:column; gap:8px;}
.doc-item{display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:8px; padding:9px 12px; background:var(--paper-2);}
.doc-item img{width:44px; height:44px; object-fit:cover; border-radius:5px; border:1px solid var(--line);}
.doc-item .ph{width:44px; height:44px; border-radius:5px; background:var(--line-soft); display:flex; align-items:center; justify-content:center; font-size:18px;}
.doc-item .meta{flex:1; min-width:0;}
.doc-item .meta .nm{font-weight:600; font-size:13.4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.doc-item .meta .mt{font-size:11.6px; color:var(--ink-soft);}
.pages-strip{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0;}
.pages-strip .pg{position:relative;}
.pages-strip img{width:70px; height:90px; object-fit:cover; border-radius:6px; border:1px solid var(--line);}
.pages-strip button{position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%; background:var(--clay); color:#fff; border:none; font-size:11px; line-height:1;}

/* Attestation preview */
.paper-preview{background:#fff; color:#111; border:1px solid var(--line); border-radius:8px; padding:26px 30px; font-family:'Source Serif 4',serif; font-size:13.6px; line-height:1.7;}
.paper-preview h4{font-family:'Source Serif 4',serif; text-align:center; text-transform:uppercase; letter-spacing:1px; font-size:15px; margin-bottom:18px;}
.paper-preview .sign{margin-top:40px; display:flex; justify-content:space-between;}

/* Modal */
.overlay{position:fixed; inset:0; background:rgba(10,14,24,.55); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;}
.modal{background:var(--paper-2); border-radius:12px; max-width:520px; width:100%; max-height:86vh; overflow-y:auto; padding:22px 24px calc(22px + env(safe-area-inset-bottom,0px));}
.check-row{display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line-soft);}
.check-row input{margin-top:3px; width:18px; height:18px; accent-color:var(--teal);}

/* Contacts */
.contact-card{border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:10px; background:var(--paper-2);}
.contact-card h4{font-size:14.5px; margin-bottom:4px;}
.tag{display:inline-block; font-size:11px; font-weight:700; background:var(--line-soft); color:var(--ink-soft); padding:2px 8px; border-radius:999px; margin-right:5px;}

.notice{border:1px solid var(--line); border-left:4px solid var(--ochre); background:var(--paper-2); border-radius:8px; padding:12px 15px; font-size:12.8px; color:var(--ink-soft); margin-bottom:16px;}
.notice b{color:var(--ink);}
.savebar{position:fixed; bottom:16px; right:20px; background:var(--navy); color:#fff; padding:9px 16px; border-radius:999px; font-size:12.3px; opacity:0; transform:translateY(8px); transition:all .25s; pointer-events:none; z-index:60;}
.savebar.show{opacity:1; transform:translateY(0);}

@media (max-width:820px){
  #app{flex-direction:column;}
  .sidebar{
    position:sticky; top:0; z-index:40; width:100%; height:auto; flex:none;
    padding:calc(10px + env(safe-area-inset-top,0px)) 10px 10px;
    box-shadow:0 2px 10px rgba(0,0,0,.25);
  }
  .brand{padding:2px 4px 10px; margin-bottom:8px;}
  nav.steps{flex-direction:row; overflow-x:auto; gap:8px; padding-bottom:2px; -webkit-overflow-scrolling:touch;}
  .step-btn{
    flex:0 0 auto; white-space:nowrap; background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14); padding:8px 12px;
  }
  .step-btn .label{color:#FFFFFF;}
  .step-btn .sub{display:none;}
  .step-btn.active{background:var(--ochre); border-color:var(--ochre);}
  .step-btn.active .num{background:rgba(255,255,255,.35); color:#fff;}
  .step-btn.active .label{color:#fff;}
  main{padding:18px 16px 60px; max-width:100%;}
  .sidebar-toolbar{ max-width:200px; }
  .sidebar-foot{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .sidebar-foot .foot-notice-text{ display:none; }
  .sidebar-foot .btn{ width:auto; flex:1 1 140px; margin-top:0 !important; }
}

/* ---- Bandeau d'échéances ---- */
.alert-banner{border-radius:10px; padding:12px 16px; margin-bottom:18px; display:flex; flex-direction:column; gap:6px; border:1px solid;}
.alert-banner.lvl-info{background:#EAF1DA; border-color:#5C7A2E; color:#3E5620;}
.alert-banner.lvl-warn{background:#F5EBD3; border-color:var(--ochre); color:var(--ochre-ink);}
.alert-banner.lvl-urgent{background:var(--clay-bg); border-color:var(--clay); color:var(--clay);}
.alert-row{display:flex; align-items:center; gap:8px; font-size:12.8px; font-weight:600;}
.alert-row .dot{width:7px; height:7px; border-radius:50%; background:currentColor; flex:0 0 auto;}

/* ---- Navigation précédent/suivant ---- */
.step-nav{display:flex; justify-content:space-between; align-items:center; margin-top:28px; padding-top:18px; border-top:1px solid var(--line);}
.step-nav .spacer{flex:1;}

/* ---- OCR ---- */
.ocr-panel{margin-top:12px; border:1px solid var(--line); border-radius:8px; padding:12px 14px; background:var(--line-soft);}
.ocr-panel textarea{min-height:110px; font-family:ui-monospace, monospace; font-size:12px;}
.ocr-field-row{display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap;}
.ocr-field-row label{font-size:12.3px; font-weight:600; white-space:nowrap;}
.ocr-field-row input{max-width:170px;}
.spinner{display:inline-block; width:13px; height:13px; border:2px solid rgba(0,0,0,.2); border-top-color:var(--navy); border-radius:50%; animation:spin .7s linear infinite; margin-right:6px; vertical-align:-2px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---- Visionneuse plein écran ---- */
.viewer-overlay{position:fixed; inset:0; background:rgba(10,10,14,.92); z-index:80; display:flex; flex-direction:column;}
.viewer-head{display:flex; align-items:center; justify-content:space-between; padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px; color:#fff;}
.viewer-head button{background:rgba(255,255,255,.12); border:none; color:#fff; border-radius:8px; padding:8px 14px; font-size:13px;}
.viewer-body{flex:1; display:flex; align-items:center; justify-content:center; overflow:auto; padding:10px;}
.viewer-body img{max-width:95%; max-height:85vh; object-fit:contain; border-radius:4px; box-shadow:0 10px 40px rgba(0,0,0,.5);}
.viewer-nav{display:flex; justify-content:center; gap:16px; padding:10px 0 calc(14px + env(safe-area-inset-bottom,0px)); color:#fff; align-items:center;}
.viewer-nav button{background:rgba(255,255,255,.12); border:none; color:#fff; border-radius:8px; padding:8px 16px; font-size:14px;}
.viewer-nav button:disabled{opacity:.35;}

/* ---- Mode accessibilité ---- */
html.a11y-mode{ font-size:118%; }
html.a11y-mode .hint{ color:var(--ink); font-size:1em; }
html.a11y-mode .btn{ padding:12px 18px; font-size:1.05em; }
html.a11y-mode .choice{ padding:11px 16px; font-size:1.02em; }
html.a11y-mode input, html.a11y-mode select, html.a11y-mode textarea{ padding:12px 13px; font-size:1.05em; }
html.a11y-mode .view-lede{ color:var(--ink); }
html.a11y-mode .card, html.a11y-mode .doc-group, html.a11y-mode .contact-card{ border-width:2px; }
html.a11y-mode :focus-visible{ outline:3px solid var(--ochre); outline-offset:3px; }
html.a11y-mode .step-btn .sub{ color:#D6DAE6; }
.welcome-shell{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:calc(32px + env(safe-area-inset-top,0px)) 20px calc(32px + env(safe-area-inset-bottom,0px)); background:var(--navy);}
.welcome-card{background:var(--paper-2); border-radius:16px; max-width:460px; width:100%; padding:34px 30px; box-shadow:0 24px 70px rgba(0,0,0,.28);}
.welcome-mark{width:50px; height:50px; border-radius:12px; background:var(--ochre); display:flex; align-items:center; justify-content:center; font-size:24px; margin-bottom:16px;}
.welcome-card h1{font-size:23px; margin-bottom:4px;}
.welcome-card .tagline{color:var(--ink-soft); margin-bottom:22px; font-size:13.6px;}
.welcome-actions{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
.welcome-actions .btn{justify-content:center; width:100%; padding:12px 16px;}
.welcome-divider{display:flex; align-items:center; gap:10px; margin:14px 0; color:var(--ink-soft); font-size:11.5px;}
.welcome-divider::before, .welcome-divider::after{content:""; flex:1; height:1px; background:var(--line);}
@media print{
  body *{visibility:hidden;}
  .print-target, .print-target *{visibility:visible;}
  .print-target{position:absolute; top:0; left:0; width:100%;}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="savebar" id="savebar">Enregistré sur cet appareil</div>

<script>
/* =========================================================================
   CLÉ DE DOSSIER — assistant logement social
   Toutes les données restent dans le navigateur (localStorage). Rien n'est
   envoyé à un serveur : c'est un choix délibéré pour la protection des
   données (territorialité = l'appareil de la personne, point final).
   ========================================================================= */

const LS_KEY = 'cledossier_state_v1';

const DEFAULT_STATE = {
  profil: {
    statut: null,        // 'francais' | 'ue' | 'hors_ue_titre' | 'hors_ue_demande'
    hebergement: null,   // 'locataire' | 'heberge' | 'proprietaire' | 'sans_domicile' | 'foyer'
    activite: null,      // 'salarie' | 'independant' | 'sans_emploi' | 'retraite' | 'etudiant' | 'inactif'
    famille: null,       // 'seul' | 'couple' | 'famille_enfants' | 'famille_monoparentale' | 'separe_recent'
    taille: 1,
    zone: 'autres',       // 'paris' | 'idf' | 'autres'
    rfr: '',
    casParticuliers: [], // 'handicap','violences','ue_recent','sans_papiers_regularisation'
    dateDepot: '',        // date de dépôt / dernier renouvellement de la demande SNE
    revenuMensuelNet: '', // revenu mensuel net du foyer (tous membres)
    loyerEstime: '',      // loyer envisagé ou observé (hors charges)
    chargesLocatives: '', // charges locatives mensuelles estimées
    credits: '',          // mensualités de crédits en cours
    pensionsVersees: '',  // pensions alimentaires versées
    autresCharges: ''     // autres charges récurrentes mensuelles
  },
  checklistTicked: {},   // id -> bool
  documents: [],         // {id, name, category, pages:[dataURL,...], addedAt, memberId, expiry, ocrText}
  attestations: [],      // saved generated attestations
  activeTab: 'profil',
  onboarded: false,      // écran d'accueil franchi ?
  notifsEnabled: false,  // rappels navigateur activés ?
  a11y: false,            // mode accessibilité (texte agrandi / contraste renforcé)
  lang: 'fr',            // langue de l'interface : fr | en | ar | pt
  membres: [{id:'principal', nom:'', role:'principal'}], // foyer : demandeur + co-demandeur/enfants
  suivi: {
    numeroUnique: '',
    statut: 'non_depose', // non_depose | en_attente | proposition | refuse | attribue
    journal: []           // {id, date, texte}
  }
};

function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return structuredClone(DEFAULT_STATE);
    const parsed = JSON.parse(raw);
    const merged = Object.assign(structuredClone(DEFAULT_STATE), parsed, {
      profil: Object.assign(structuredClone(DEFAULT_STATE.profil), parsed.profil||{}),
      suivi: Object.assign(structuredClone(DEFAULT_STATE.suivi), parsed.suivi||{}),
      membres: Array.isArray(parsed.membres) && parsed.membres.length ? parsed.membres : structuredClone(DEFAULT_STATE.membres),
    });
    return merged;
  }catch(e){ return structuredClone(DEFAULT_STATE); }
}
let state = loadState();
let saveTimer=null;
function persist(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    const bar=document.getElementById('savebar');
    bar.classList.add('show');
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>bar.classList.remove('show'), 1200);
  }catch(e){
    console.error('Stockage local indisponible ou plein', e);
  }
}

function printOnly(el){

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }

/* -------------------------- SAUVEGARDE / RESTAURATION -------------------------- */
function buildBackupObject(){
  return {
    format: 'cledossier-backup',
    version: 1,
    exportedAt: new Date().toISOString(),
    profil: state.profil,
    checklistTicked: state.checklistTicked,
    documents: state.documents,
    attestations: state.attestations,
  };
}
async function exportBackup(){
  const json = JSON.stringify(buildBackupObject(), null, 2);
  const filename = 'sauvegarde-dossier-logement-' + new Date().toISOString().slice(0,10) + '.json';
  if(downloadsCap){
    try{ await downloadsCap.save({filename, data: json}); return; }catch(e){ console.error(e); }
  }
  const blob = new Blob([json], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
}
function importBackupFile(file, onDone){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data || typeof data !== 'object' || !data.profil){
        alert('Ce fichier ne ressemble pas à une sauvegarde valide de Clé de dossier.');
        return;
      }
      state.profil = Object.assign(structuredClone(DEFAULT_STATE.profil), data.profil||{});
      state.checklistTicked = data.checklistTicked || {};
      state.documents = Array.isArray(data.documents) ? data.documents : [];
      state.attestations = Array.isArray(data.attestations) ? data.attestations : [];
      state.onboarded = true;
      persist();
      onDone && onDone();
    }catch(e){
      alert('Impossible de lire ce fichier : il n\u2019est pas au format JSON attendu.');
    }
  };
  reader.readAsText(file);
}

  const btnNew = document.getElementById('btn-new');
  if(btnNew) btnNew.addEventListener('click', goApp);
  const btnReset = document.getElementById('btn-reset');
  if(btnReset) btnReset.addEventListener('click', ()=>{
    if(confirm('Cela remplace le dossier actuel sur cet appareil par un dossier vierge. Pense à exporter une sauvegarde avant si besoin. Continuer ?')){
      const keepOnboard = true;
      state = structuredClone(DEFAULT_STATE);
      state.onboarded = keepOnboard;
      persist();
      render();
    }
  });
  document.getElementById('btn-import').addEventListener('click', ()=>document.getElementById('import-input').click());
  document.getElementById('import-input').addEventListener('change', (e)=>{
    const f = e.target.files[0];
    if(f) importBackupFile(f, ()=>render());
  });
}

  applyDocDirection();

  if(!state.onboarded){ renderWelcome(); } else { render(); }
}

/* ==================== ALERTES D'ÉCHÉANCE ==================== */
function daysBetween(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return null;
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((d-now)/86400000);
}
function levelFor(days){
  if(days<0) return 'urgent';
  if(days<=7) return 'urgent';
  if(days<=14) return 'warn';
  if(days<=30) return 'info';
  return null;
}
function computeDeadlineAlerts(){
  const alerts = [];
  const p = state.profil;
  if(p.dateDepot){
    const exp = new Date(p.dateDepot+'T00:00:00');
    exp.setFullYear(exp.getFullYear()+1);
    const iso = exp.toISOString().slice(0,10);
    const days = daysBetween(iso);
    const lvl = days!=null ? levelFor(days) : null;
    if(lvl){
      alerts.push({
        level:lvl, days,
        label: days<0
          ? `Ta demande de logement social a dépassé sa date de renouvellement (le ${exp.toLocaleDateString('fr-FR')}) — elle risque d\u2019être radiée si ce n\u2019est pas déjà fait.`
          : `Ta demande de logement social doit être renouvelée avant le ${exp.toLocaleDateString('fr-FR')} (dans ${days} jour${days>1?'s':''}).`
      });
    }
  }
  state.documents.forEach(d=>{
    if(!d.expiry) return;
    const days = daysBetween(d.expiry);
    const lvl = days!=null ? levelFor(days) : null;
    if(lvl){
      alerts.push({
        level:lvl, days,
        label: days<0
          ? `Le document « ${d.name} » a dépassé sa date de validité (${new Date(d.expiry+'T00:00:00').toLocaleDateString('fr-FR')}) — pense à le renouveler.`
          : `Le document « ${d.name} » arrive à expiration le ${new Date(d.expiry+'T00:00:00').toLocaleDateString('fr-FR')} (dans ${days} jour${days>1?'s':''}).`
      });
    }
  });
  if(state.documents.length){
    state.membres.forEach(m=>{
      if(m.role==='enfant') return; // les enfants n'ont en général pas de pièces propres
      if(m.role!=='principal' && !m.nom) return; // placeholder non renseigné
      const hasDocs = state.documents.some(d=>d.memberId===m.id);
      if(!hasDocs){
        const who = m.nom || (t('membres.roleOpts').principal);
        alerts.push({level:'info', days:999, label:`Aucun document n\u2019est encore associé à ${who} dans le coffre-fort — pense à vérifier que sa pièce d\u2019identité et ses justificatifs de ressources y figurent.`});
      }
    });
  }
  const order = {urgent:0, warn:1, info:2};
  alerts.sort((a,b)=>order[a.level]-order[b.level] || a.days-b.days);
  return alerts;
}
function renderAlertBanner(main){
  const alerts = computeDeadlineAlerts();
  if(!alerts.length) return;
  const worst = alerts[0].level;
  const box = document.createElement('div');
  box.className = 'alert-banner lvl-'+worst;
  box.innerHTML = `<b style="font-size:13.2px;">⏰ ${alerts.length>1? alerts.length+' échéances à surveiller' : 'Échéance à surveiller'}</b>` +
    alerts.map(a=>`<div class="alert-row"><span class="dot"></span>${esc(a.label)}</div>`).join('');
  main.appendChild(box);
}
function maybeFireBrowserNotifications(){
  if(!state.notifsEnabled || typeof Notification==='undefined' || Notification.permission!=='granted') return;
  const alerts = computeDeadlineAlerts().filter(a=>a.level==='urgent' || a.level==='warn');
  alerts.slice(0,3).forEach(a=>{
    try{ new Notification('Clé de dossier — rappel', {body:a.label}); }catch(e){}
  });
}

const GLOSSARY = {
  fr: [
    {term:'PLAI', def:'Prêt Locatif Aidé d\u2019Intégration : la catégorie de logement social la plus accessible financièrement, pour les ménages aux ressources les plus modestes.'},
    {term:'PLUS', def:'Prêt Locatif à Usage Social : la catégorie de logement social « classique », la plus répandue.'},
    {term:'PLS', def:'Prêt Locatif Social : logement social dit « intermédiaire », avec des plafonds de ressources plus élevés.'},
    {term:'RFR', def:'Revenu Fiscal de Référence : le montant, indiqué sur l\u2019avis d\u2019imposition, qui sert à calculer l\u2019éligibilité aux plafonds de ressources.'},
    {term:'DALO', def:'Droit Au Logement Opposable : un recours qui permet à une personne prioritaire de demander à être relogée en urgence par la préfecture.'},
    {term:'DAHO', def:'Droit à l\u2019Hébergement Opposable : équivalent du DALO, mais pour obtenir une place d\u2019hébergement plutôt qu\u2019un logement.'},
    {term:'SNE', def:'Système National d\u2019Enregistrement : le fichier national où toute demande de logement social doit être enregistrée.'},
    {term:'Numéro unique', def:'Le numéro attribué à ta demande lors de son enregistrement au SNE. À conserver précieusement, il est demandé pour tout renouvellement ou recours.'},
    {term:'Cotation', def:'Système de points utilisé par certaines collectivités (ex. Paris) pour classer les demandes selon des critères d\u2019urgence. Les règles varient fortement d\u2019un territoire à l\u2019autre.'},
    {term:'Réservataire', def:'Un organisme (préfecture, mairie, Action Logement, bailleur) qui dispose d\u2019un « contingent » de logements sur lequel il peut proposer des candidats.'},

/* Chaque groupe: {id, title, type:'ET'|'OU', note?, options:[{id,name,desc}]} */
function buildChecklist(p){
  const groups = [];

  groups.push({id:'identite', title:'Pièce d\u2019identité de chaque personne majeure du foyer', type:'ET',
    options:[
      {id:'cni', name:'Carte nationale d\u2019identité en cours de validité (recto ET verso)'},
      {id:'passeport', name:'Passeport en cours de validité'},

  if(p.statut==='hors_ue_titre' || p.statut==='hors_ue_demande'){
    groups.push({id:'sejour', title:'Justificatif de séjour', type:'OU', note:'Un seul des deux suffit',
      options:[
        {id:'titre_sejour', name:'Titre de séjour en cours de validité (recto/verso)'},
        {id:'recepisse', name:'Récépissé de renouvellement de titre de séjour'},
      ]});

  groups.push({id:'imposition', title:'Avis d\u2019imposition (ou de non-imposition) N-2', type:'ET',
    note:'Une copie complète, toutes pages, pour chaque personne majeure du foyer',
    options:[
      {id:'avis_n2', name:'Avis d\u2019imposition sur le revenu de l\u2019année de référence (n-2)'},
    ]});

  // Hébergement
  if(p.hebergement==='locataire'){
    groups.push({id:'logement_actuel', title:'Justificatif du logement actuel', type:'OU',
      options:[
        {id:'quittance', name:'Dernière quittance de loyer'},
        {id:'attest_bailleur', name:'Attestation du bailleur (à jour du paiement des loyers)'},

  } else if(p.hebergement==='heberge'){
    groups.push({id:'hebergement_tiers', title:'Hébergement chez un tiers — dossier complet de l\u2019hébergeant', type:'ET',
      note:'Ces 3 pièces sont demandées ensemble',
      options:[
        {id:'attest_hebergement', name:'Attestation d\u2019hébergement sur l\u2019honneur, signée et datée de moins de 3 mois'},
        {id:'cni_hebergeant', name:'Copie de la pièce d\u2019identité de l\u2019hébergeant'},

  } else if(p.hebergement==='proprietaire'){
    groups.push({id:'propriete', title:'Justificatif de propriété du logement actuel', type:'OU',
      options:[
        {id:'taxe_fonciere', name:'Dernier avis de taxe foncière'},
        {id:'titre_propriete', name:'Titre de propriété ou attestation notariée'},
      ]});
  } else if(p.hebergement==='sans_domicile'){
    groups.push({id:'domiciliation', title:'Domiciliation administrative', type:'OU',
      note:'Nécessaire en l\u2019absence d\u2019adresse personnelle stable',

        {id:'attest_domiciliation', name:'Attestation de domiciliation délivrée par un CCAS'},

      ]});
  } else if(p.hebergement==='foyer'){
    groups.push({id:'foyer_justif', title:'Justificatif de résidence en structure collective', type:'ET',
      options:[

  }

  // Activité / ressources
  if(p.activite==='salarie'){
    groups.push({id:'ressources_salarie', title:'Justificatifs de ressources — salarié·e', type:'ET',
      options:[
        {id:'bulletins', name:'3 derniers bulletins de salaire'},
        {id:'contrat', name:'Contrat de travail'},
      ]});
    groups.push({id:'ressources_salarie_alt', title:'Alternative au contrat de travail', type:'OU',
      note:'Si le contrat de travail n\u2019est pas disponible',
      options:[{id:'attest_employeur', name:'Attestation de l\u2019employeur (poste, date d\u2019embauche, type de contrat)'}]});

    groups.push({id:'ressources_indep', title:'Justificatifs de ressources — indépendant·e / auto-entrepreneur·e', type:'OU',
      options:[
        {id:'bilan', name:'Dernier bilan comptable ou liasse fiscale'},
        {id:'urssaf', name:'Attestation URSSAF de chiffre d\u2019affaires (auto-entrepreneur)'},
      ]});
  } else if(p.activite==='sans_emploi'){
    groups.push({id:'ressources_chomage', title:'Justificatifs de ressources — sans emploi', type:'OU',

      note:'Bourse, job étudiant, ou rattachement au foyer fiscal des parents',

        {id:'caf', name:'Attestation de la CAF/MSA (quotient familial, allocations), de moins de 3 mois'},
      ]});
  }

  // Cas particuliers
  if(p.casParticuliers.includes('handicap')){
    groups.push({id:'handicap', title:'Situation de handicap', type:'OU',
      note:'Permet un surclassement dans une catégorie de ménage supérieure',
      options:[
        {id:'cmi', name:'Carte mobilité inclusion (CMI) mention invalidité'},
        {id:'notif_mdph', name:'Notification de la MDPH'},

  if(p.casParticuliers.includes('violences')){

      ]});

  if(p.casParticuliers.includes('ue_recent')){
    groups.push({id:'ue_recent', title:'Ressortissant·e UE/EEE installé·e depuis moins de 5 ans', type:'ET',
      options:[
        {id:'justif_ressources_ue', name:'Justificatif de ressources suffisantes et stables'},
        {id:'justif_residence_ue', name:'Justificatif d\u2019entrée sur le territoire (durée de résidence)'},
      ]});
  }

  return groups;
}

/* ==================== ÉLIGIBILITÉ PLAI/PLUS/PLS ==================== */
/* Barèmes annuels 2025 (RFR N-2), source : arrêté du 23.12.2024 (JO 30.12.24),
   repris notamment par les mémentos USH/OPHIS. À vérifier chaque année. */
const BAREME_PLUS = {
  paris: {1:26687,2:39885,3:52284,4:62424,5:74271,6:83575, plus:9313},
  idf:   {1:26687,2:39885,3:47944,4:57429,5:67984,6:76504, plus:8524},
  autres:{1:23201,2:30984,3:37259,4:44982,5:52915,6:59636, plus:6652},
};
const BAREME_PLAI = {
  paris: {1:14683,2:23931,3:31369,4:34338,5:40847,6:45968, plus:5121},
  idf:   {1:14683,2:23931,3:28767,4:31585,5:37393,6:42077, plus:4686},
  autres:{1:12759,2:18591,3:22356,4:24875,5:29105,6:32800, plus:3657},
};
function plafondFor(bareme, zone, taille){
  const t = Math.max(1, Math.round(taille));
  if(t<=6) return bareme[zone][t];
  return bareme[zone][6] + (t-6)*bareme[zone].plus;
}
function plafondPLS(zone, taille){ return Math.round(plafondFor(BAREME_PLUS, zone, taille) * 1.3); }

function computeEligibilite(p){
  const rfr = Number(p.rfr)||0;
  const taille = Number(p.taille)||1;
  const zone = p.zone;
  const plai = plafondFor(BAREME_PLAI, zone, taille);
  const plus = plafondFor(BAREME_PLUS, zone, taille);
  const pls  = plafondPLS(zone, taille);
  let diag, cls;
  if(rfr<=plai){ diag='Éligible au logement très social (PLAI)'; cls='plai'; }
  else if(rfr<=plus){ diag='Éligible au logement social classique (PLUS)'; cls='plus'; }
  else if(rfr<=pls){ diag='Éligible au logement social intermédiaire (PLS)'; cls='pls'; }
  else { diag='Au-delà des plafonds HLM (PLAI/PLUS/PLS) pour ce profil'; cls='none'; }
  return {rfr, taille, zone, plai, plus, pls, diag, cls};
}

    desc:'Toute demande de logement social doit être enregistrée en mairie, en préfecture, auprès d\u2019un bailleur social ou en ligne sur demande-logement-social.gouv.fr. Un numéro unique départemental (ou régional en Île-de-France) est délivré.'});

  if(p.activite==='salarie'){
    list.push({tag:'Réservataire possible', title:'Action Logement (si l\u2019employeur cotise à l\u2019effort de construction)',
      desc:'Les salarié·e·s d\u2019entreprises du secteur privé non agricole de 50 salariés ou plus peuvent solliciter le contingent Action Logement, souvent avec des délais plus courts.'});
  }
  if(p.casParticuliers.includes('violences') || p.casParticuliers.includes('handicap') || p.hebergement==='sans_domicile'){
    list.push({tag:'Procédure prioritaire', title:'Recours DALO en préfecture',
      desc:'En cas de situation prioritaire (sans domicile, handicap avec logement inadapté, violences, délai anormalement long), un recours devant la commission de médiation (préfecture) peut accélérer l\u2019attribution.'});
  }
  list.push({tag:'Guichet local', title:'Mairie ou CCAS de la commune souhaitée',
    desc:'Beaucoup de communes disposent d\u2019un contingent municipal. C\u2019est aussi un guichet d\u2019enregistrement et souvent d\u2019accompagnement social.'});
  list.push({tag:'Guichet local', title:'Bailleur(s) social(aux) du secteur visé',
    desc:'Chaque organisme HLM peut enregistrer directement une demande et gère son propre contingent propre en dehors des réservations préfecture/mairie/Action Logement.'});
  if(p.hebergement==='foyer' || p.casParticuliers.includes('sans_papiers_regularisation')){
    list.push({tag:'Accompagnement', title:'Travailleur·se social·e référent·e (CCAS, foyer, association)',
      desc:'Un accompagnement social facilite souvent la constitution du dossier et l\u2019identification du bon contingent, en particulier pour les situations complexes.'});
  }
  return list;
}
function reservatairePrioritaireLabel(p){
  if(p.casParticuliers.includes('violences') || p.casParticuliers.includes('handicap') || p.hebergement==='sans_domicile'){
    return 'Préfecture / État — recours DALO possible (situation prioritaire)';
  }
  if(p.activite==='salarie'){
    return 'Action Logement (salarié·e du secteur privé, sous réserve de cotisation de l\u2019employeur)';
  }
  return 'Aucun réservataire prioritaire identifié — passe par le contingent communal, le bailleur, ou la préfecture au titre du droit commun';
}

function renderStepNav(main){
  const idx = STEPS.findIndex(s=>s.id===state.activeTab);
  if(idx<0) return;
  const prev = STEPS[idx-1], next = STEPS[idx+1];
  const nav = document.createElement('div');
  nav.className = 'step-nav';
  nav.innerHTML = `
    ${prev ? `<button class="btn btn-ghost" id="nav-prev">← ${esc(stepLabel(prev))}</button>` : `<span class="spacer"></span>`}
    <span class="spacer"></span>
    ${next ? `<button class="btn btn-primary" id="nav-next">${esc(stepLabel(next))} →</button>` : ''}
  `;
  main.appendChild(nav);
  if(prev) nav.querySelector('#nav-prev').addEventListener('click', ()=>setTab(prev.id));
  if(next) nav.querySelector('#nav-next').addEventListener('click', ()=>setTab(next.id));
}

/* ---------- 1. PROFIL ---------- */
function chip(container, groupKey, value, current, label){
  const el = document.createElement('button');
  el.type='button';
  el.className = 'choice' + (current===value?' sel':'');
  el.textContent = label;
  el.addEventListener('click', ()=>{
    state.profil[groupKey] = value;
    persist(); renderMain();
  });
  container.appendChild(el);
}
function multiChip(container, value, arr, label){
  const el = document.createElement('button');
  el.type='button';
  const on = arr.includes(value);
  el.className = 'choice' + (on?' sel':'');
  el.textContent = label;
  el.addEventListener('click', ()=>{
    const i = arr.indexOf(value);
    if(i>-1) arr.splice(i,1); else arr.push(value);
    persist(); renderMain();
  });
  container.appendChild(el);
}

/* ---------- 2. CHECKLIST ---------- */
function renderChecklist(main){
  const p = state.profil;
  const ready = p.statut && p.hebergement && p.activite && p.famille;
  main.innerHTML = `<h1 class="view-title">Ma checklist</h1>
    <p class="view-lede">Générée à partir de ton profil. Les blocs <span class="pill pill-et">ET</span> regroupent des pièces toutes obligatoires ; les blocs <span class="pill pill-ou">OU</span> proposent des alternatives — une seule pièce cochée dans le bloc suffit.</p>`;

  if(!ready){
    main.innerHTML += `<div class="notice">Complète d\u2019abord ton <a href="#" id="go-profil">profil</a> (statut, logement, activité, situation familiale) pour générer la checklist.</div>`;
    main.querySelector('#go-profil').addEventListener('click', e=>{e.preventDefault(); setTab('profil');});
    return;
  }

  const groups = buildChecklist(p);
  let totalOpts=0, tickedCount=0, groupsDone=0;
  groups.forEach(g=>{
    const anyTicked = g.options.some(o=>state.checklistTicked[o.id]);
    if(g.type==='ET'){
      const allTicked = g.options.every(o=>state.checklistTicked[o.id]);
      if(allTicked) groupsDone++;
    } else if(anyTicked) groupsDone++;
    g.options.forEach(o=>{ totalOpts++; if(state.checklistTicked[o.id]) tickedCount++; });
  });
  const pct = groups.length ? Math.round(groupsDone/groups.length*100) : 0;

  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-num">${groupsDone}/${groups.length} rubriques complètes</div>
    </div>
  `;
  groups.forEach(g=>{
    const gEl = document.createElement('div');
    gEl.className = 'doc-group ' + (g.type==='ET'?'et':'ou');
    gEl.innerHTML = `
      <div class="doc-group-head">
        <div class="doc-group-title">${esc(g.title)}</div>
        <span class="pill ${g.type==='ET'?'pill-et':'pill-ou'}">${g.type}</span>
      </div>
      <div class="doc-opts">
        ${g.note?`<div class="hint" style="margin-bottom:6px;">${esc(g.note)}</div>`:''}
        ${g.options.map((o,i)=>`
          ${g.type==='OU' && i>0 ? `<div class="or-sep">ou</div>`:''}
          <label class="doc-opt">
            <input type="checkbox" data-opt="${o.id}" ${state.checklistTicked[o.id]?'checked':''}>
            <span class="opt-txt"><span class="n">${esc(o.name)}</span>${o.desc?`<span class="d">${esc(o.desc)}</span>`:''}</span>
          </label>`).join('')}
      </div>
    `;
    wrap.appendChild(gEl);
  });
  main.appendChild(wrap);
  wrap.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      state.checklistTicked[cb.dataset.opt] = cb.checked;
      persist(); renderChecklist(main);
    });
  });

  const note = document.createElement('div');
  note.className='notice';
  note.innerHTML = '<b>À vérifier au cas par cas :</b> cette checklist suit les règles générales des dossiers de demande de logement social. Certains bailleurs ou certaines communes peuvent demander une pièce supplémentaire ou accepter une alternative non listée ici — vérifie toujours avec le guichet d\u2019enregistrement.';
  main.appendChild(note);
}

  zones.forEach(([v,l])=>chip(document.getElementById('c-zone2'), 'zone', v, p.zone, l));

  document.getElementById('i-rfr').addEventListener('input', e=>{ p.rfr = e.target.value; persist(); renderDiagZone(); });
  document.getElementById('i-taille2').addEventListener('change', e=>{
    p.taille = Math.max(1, Math.min(12, Number(e.target.value)||1)); persist(); renderMain();
  });
  function renderDiagZone(){
    const target = document.getElementById('diag-zone');
    if(!p.rfr){ target.innerHTML=''; return; }
    const r = computeEligibilite(p);
    target.innerHTML = `
      <div class="diag ${r.cls}">
        <h3>${esc(r.diag)}</h3>
        <p>RFR déclaré : <b>${r.rfr.toLocaleString('fr-FR')} €</b> — foyer de ${r.taille} personne(s), zone « ${zones.find(z=>z[0]===r.zone)[1]} ».</p>
        <table class="bareme">
          <tr><th>Type</th><th>Plafond applicable</th></tr>
          <tr class="${r.cls==='plai'?'hl':''}"><td>PLAI — logement très social</td><td>${r.plai.toLocaleString('fr-FR')} €</td></tr>
          <tr class="${r.cls==='plus'?'hl':''}"><td>PLUS — logement social classique</td><td>${r.plus.toLocaleString('fr-FR')} €</td></tr>
          <tr class="${r.cls==='pls'?'hl':''}"><td>PLS — logement social intermédiaire</td><td>${r.pls.toLocaleString('fr-FR')} €</td></tr>
        </table>
      </div>`;
  }
  renderDiagZone();

  // --- budget : reste à vivre / taux d'effort
  const budgetInputs = ['i-revenu','i-loyer','i-chargesloc','i-credits','i-pensions','i-autrescharges'];
  const fieldMap = {'i-revenu':'revenuMensuelNet','i-loyer':'loyerEstime','i-chargesloc':'chargesLocatives','i-credits':'credits','i-pensions':'pensionsVersees','i-autrescharges':'autresCharges'};
  budgetInputs.forEach(id=>{
    document.getElementById(id).addEventListener('input', e=>{
      p[fieldMap[id]] = e.target.value; persist(); renderBudget();
    });
  });
  function renderBudget(){
    const target = document.getElementById('budget-result');
    const revenu = Number(p.revenuMensuelNet)||0;
    if(!revenu){ target.innerHTML = `<div class="notice">${esc(t('budget.needRevenu'))}</div>`; return; }
    const loyer = Number(p.loyerEstime)||0;
    const chargesLoc = Number(p.chargesLocatives)||0;
    const credits = Number(p.credits)||0;
    const pensions = Number(p.pensionsVersees)||0;
    const autres = Number(p.autresCharges)||0;
    const tauxEffort = revenu>0 ? ((loyer+chargesLoc)/revenu*100) : 0;
    const resteAVivre = revenu - loyer - chargesLoc - credits - pensions - autres;
    const taille = Math.max(1, Number(p.taille)||1);
    const resteParPersonne = resteAVivre / taille;
    let band = 'plai', bandMsg = t('budget.bandGood');
    if(tauxEffort>=33){ band='none'; bandMsg = t('budget.bandHigh'); }
    else if(tauxEffort>=28){ band='pls'; bandMsg = t('budget.bandWarn'); }
    target.innerHTML = `
      <div class="diag ${band}" style="margin-top:14px;">
        <h3>${esc(t('budget.tauxEffort'))} : ${tauxEffort.toFixed(1)} %</h3>
        <p style="margin-bottom:4px;">${esc(t('budget.tauxEffortDef'))}<br>${esc(bandMsg)}</p>
        <table class="bareme">
          <tr><th>${esc(t('budget.resteAVivre'))}</th><td>${resteAVivre.toLocaleString('fr-FR')} €/mois</td></tr>
          <tr><th>${esc(t('budget.resteAVivreParPersonne'))}</th><td>${resteParPersonne.toLocaleString('fr-FR', {maximumFractionDigits:0})} €/mois</td></tr>
        </table>
        <p class="hint" style="margin-top:8px; margin-bottom:0;">${esc(t('budget.resteAVivreDef'))}</p>
      </div>`;
  }
  renderBudget();
}

      const img = await loadImage(pendingPages[i]);
      const ratio = Math.min(pageW/img.width, pageH/img.height);
      const w=img.width*ratio, h=img.height*ratio;
      pdf.addImage(img, 'JPEG', (pageW-w)/2, (pageH-h)/2, w, h);
      if(withWatermark){
        const label = watermarkLabel(name);
        addWatermark(pdf, label, pageW, pageH);

function resizeImage(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let {width,height} = img;
        if(width>maxDim || height>maxDim){
          const r = Math.min(maxDim/width, maxDim/height);
          width = Math.round(width*r); height = Math.round(height*r);
        }
        const canvas = document.createElement('canvas');
        canvas.width=width; canvas.height=height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function fileToDataUrl(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
}
function loadImage(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }
function sanitizeFilename(s){ return (s||'document').replace(/[^a-zA-Z0-9_\-\u00C0-\u024F ]/g,'').trim().replace(/\s+/g,'-').slice(0,80) || 'document'; }

async function mergeAllDocuments(btn){
  if(!window.PDFLib){

  const docsWithPdf = state.documents.filter(d=>d.pdfData);
  if(!docsWithPdf.length) return;
  const originalLabel = btn.textContent;
  btn.textContent = '⏳ Fusion en cours\u2026'; btn.disabled = true;
  try{
    const { PDFDocument, StandardFonts, rgb } = window.PDFLib;

    const font = await merged.embedFont(StandardFonts.Helvetica);
    const fontBold = await merged.embedFont(StandardFonts.HelveticaBold);

    // Page de sommaire
    const cover = merged.addPage([595.28, 841.89]);
    let y = 780;
    cover.drawText('Dossier de demande de logement social', {x:50, y, size:16, font:fontBold, color:rgb(0.09,0.14,0.25)});

    y -= 34;
    cover.drawText('Sommaire des pièces jointes :', {x:50, y, size:12, font:fontBold});
    y -= 22;
    docsWithPdf.forEach((d,i)=>{
      if(y < 60){ return; } // simplifié : liste tronquée si trop longue plutôt que de planter
      const membre = state.membres.find(m=>m.id===d.memberId);
      const who = membre ? (membre.nom || 'demandeur principal') : '';
      cover.drawText(`${i+1}. ${d.name}${who ? '  (' + who + ')' : ''}`, {x:56, y, size:10.5, font, color:rgb(0.15,0.15,0.15)});
      y -= 18;
    });
    y -= 10;
    if(y>40){
      cover.drawText('Document généré automatiquement, à titre indicatif — vérifie chaque pièce avant envoi.', {x:50, y, size:8.5, font, color:rgb(0.5,0.5,0.5)});
    }

    // Pages de chaque document (fusion réelle des PDF existants, image ou import)
    for(const d of docsWithPdf){
      try{
        const bytes = await (await fetch(d.pdfData)).arrayBuffer();
        const srcDoc = await PDFDocument.load(bytes, {ignoreEncryption:true});
        const copiedPages = await merged.copyPages(srcDoc, srcDoc.getPageIndices());
        copiedPages.forEach(pg=>merged.addPage(pg));
      }catch(err){
        console.error('Impossible de fusionner', d.name, err);
      }
    }

    const outBytes = await merged.save();
    const blob = new Blob([outBytes], {type:'application/pdf'});
    if(downloadsCap){
      try{ await downloadsCap.save({filename:'dossier-complet-logement-social.pdf', data: blob}); return; }
      catch(e){ console.error(e); }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'dossier-complet-logement-social.pdf'; a.click();
  }catch(e){
    console.error(e);
    alert('La fusion a échoué. Essaie l\u2019export ZIP à la place, ou vérifie qu\u2019aucun document n\u2019est corrompu.');
  }finally{
    btn.textContent = originalLabel; btn.disabled = false;
  }
}

/* ---------- OCR ---------- */
async function runOcr(docId, main){
  const d = state.documents.find(x=>x.id===docId);
  if(!d) return;
  const panel = document.getElementById('ocr-panel-'+docId);
  if(!panel) return;
  if(!d.pages || !d.pages.length){
    panel.innerHTML = `<div class="notice" style="margin-top:10px;">L\u2019OCR n\u2019est disponible que pour les documents scannés depuis une photo (pas pour un PDF importé directement).</div>`;
    return;
  }
  panel.innerHTML = `<div class="ocr-panel"><span class="spinner"></span>Lecture du texte en cours\u2026 (peut prendre quelques secondes, surtout la première fois)</div>`;
  try{
    let fullText = '';
    for(let i=0;i<d.pages.length;i++){
      const { data } = await Tesseract.recognize(d.pages[i], 'fra');
      fullText += (i>0?'\n\n--- page '+(i+1)+' ---\n\n':'') + (data.text||'').trim();
    }
    d.ocrText = fullText;
    persist();
    renderOcrPanel(d, panel);
  }catch(e){
    console.error(e);
    panel.innerHTML = `<div class="notice" style="margin-top:10px;">La lecture automatique a échoué. Réessaie avec une photo plus nette, ou saisis les informations manuellement.</div>`;
  }
}
function renderOcrPanel(d, panel){
  const dateMatch = d.ocrText.match(/\b([0-3]?\d)[\/.\-]([01]?\d)[\/.\-](20\d{2})\b/);
  let detectedDate = '';
  if(dateMatch){
    detectedDate = `${dateMatch[3]}-${dateMatch[2].padStart(2,'0')}-${dateMatch[1].padStart(2,'0')}`;
  }
  const amountMatches = [...d.ocrText.matchAll(/\d{1,3}[\s.]\d{3}|\d{4,6}/g)]
    .map(m=>m[0].replace(/[\s.]/g,''))
    .filter(v=>Number(v)>=1000 && Number(v)<200000);
  const suggestedAmount = amountMatches[0] || '';

  panel.innerHTML = `
    <div class="ocr-panel">
      <label style="font-weight:600; font-size:12.6px;">Texte détecté (modifiable) :</label>
      <textarea id="ocr-text-${d.id}">${esc(d.ocrText)}</textarea>
      <div class="ocr-field-row">
        <label>Date détectée :</label>
        <input type="date" id="ocr-date-${d.id}" value="${detectedDate}">
        <button class="btn btn-ghost" id="ocr-use-date-${d.id}" style="padding:5px 10px; font-size:11.8px;">Utiliser comme date de validité</button>
      </div>
      ${suggestedAmount ? `
      <div class="ocr-field-row">
        <label>Montant détecté :</label>
        <input type="text" id="ocr-amount-${d.id}" value="${esc(suggestedAmount)}">
        <button class="btn btn-ghost" id="ocr-use-amount-${d.id}" style="padding:5px 10px; font-size:11.8px;">Utiliser comme RFR (éligibilité)</button>
      </div>` : ''}
      <div class="btn-row" style="margin-top:8px;">
        <button class="btn btn-primary" id="ocr-save-${d.id}" style="padding:7px 12px; font-size:12px;">Enregistrer le texte modifié</button>
      </div>
      <div class="hint" style="margin-top:6px;">La lecture automatique peut contenir des erreurs (chiffres surtout) : vérifie toujours avant d\u2019utiliser ces valeurs.</div>
    </div>
  `;
  document.getElementById('ocr-save-'+d.id).addEventListener('click', ()=>{
    d.ocrText = document.getElementById('ocr-text-'+d.id).value;
    persist();
    alert('Texte enregistré.');
  });
  const dateBtn = document.getElementById('ocr-use-date-'+d.id);
  if(dateBtn) dateBtn.addEventListener('click', ()=>{
    const v = document.getElementById('ocr-date-'+d.id).value;
    if(v){ d.expiry = v; persist(); renderMain(); }
  });
  const amtBtn = document.getElementById('ocr-use-amount-'+d.id);
  if(amtBtn) amtBtn.addEventListener('click', ()=>{
    const v = document.getElementById('ocr-amount-'+d.id).value;
    if(v){ state.profil.rfr = v; persist(); alert('Montant utilisé comme RFR. Va dans l\u2019onglet Éligibilité pour voir le diagnostic.'); }
  });
}

function computeSyntheseData(p){
  const groups = buildChecklist(p);
  const groupsDone = groups.filter(g=> g.type==='ET' ? g.options.every(o=>state.checklistTicked[o.id]) : g.options.some(o=>state.checklistTicked[o.id]));
  const e = p.rfr ? computeEligibilite(p) : null;
  const revenu = Number(p.revenuMensuelNet)||0;
  const loyer = Number(p.loyerEstime)||0;
  const chargesLoc = Number(p.chargesLocatives)||0;
  const credits = Number(p.credits)||0;
  const pensions = Number(p.pensionsVersees)||0;
  const autres = Number(p.autresCharges)||0;
  const tauxEffort = revenu>0 ? ((loyer+chargesLoc)/revenu*100) : null;
  const resteAVivre = revenu ? (revenu - loyer - chargesLoc - credits - pensions - autres) : null;
  return {groups, groupsDone, e, revenu, loyer, chargesLoc, credits, pensions, autres, tauxEffort, resteAVivre};
}

      res.innerHTML = `<div class="pill pill-warn" style="font-size:12.5px; padding:6px 12px;">${checked}/${PRE_SEND_CHECKS.length} points vérifiés — continue avant l\u2019envoi</div>`;
    } else { res.innerHTML=''; }
  };
  overlay.querySelectorAll('input[type=checkbox]').forEach(b=>b.addEventListener('change', update));
  overlay.querySelector('#btn-close-modal').addEventListener('click', ()=>overlay.remove());
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
}

/* ---------- 6. CONTACTS ---------- */
function renderContacts(main){
  const p = state.profil;
  const ready = p.statut && p.hebergement && p.activite;
  main.innerHTML = `<h1 class="view-title">Qui contacter</h1>
    <p class="view-lede">Un guide, pas un annuaire en temps réel : identifie les bons interlocuteurs selon ton profil, puis vérifie leurs coordonnées et horaires auprès des sources officielles ci-dessous.</p>`;

  if(!ready){
    main.innerHTML += `<div class="notice">Complète d\u2019abord ton <a href="#" id="go-profil2">profil</a> pour une recommandation personnalisée.</div>`;
    main.querySelector('#go-profil2').addEventListener('click', e=>{e.preventDefault(); setTab('profil');});
  } else {
    const contacts = computeContacts(p);
    const wrap = document.createElement('div');
    contacts.forEach(c=>{
      const el = document.createElement('div');
      el.className='contact-card';
      el.innerHTML = `<span class="tag">${esc(c.tag)}</span><h4>${esc(c.title)}</h4><p style="margin-bottom:0;">${esc(c.desc)}</p>`;
      wrap.appendChild(el);
    });
    main.appendChild(wrap);
  }

  const links = document.createElement('div');
  links.className='card';
  links.innerHTML = `
    <h3>Annuaires et démarches officiels</h3>
    <p class="hint" style="margin-top:-6px;">Ce prototype ne peut pas afficher une carte en temps réel des guichets (cela demanderait une connexion à une base de données externe). Utilise ces liens officiels pour trouver et contacter le bon guichet :</p>
    <div class="btn-row">
      <a class="btn btn-ghost" href="https://www.demande-logement-social.gouv.fr" target="_blank" rel="noopener">Portail national (SNE)</a>
      <a class="btn btn-ghost" href="https://www.service-public.fr/particuliers/vosdroits/F1301" target="_blank" rel="noopener">Service-public.fr — logement social</a>
      <a class="btn btn-ghost" href="https://www.actionlogement.fr" target="_blank" rel="noopener">Action Logement</a>
      <a class="btn btn-ghost" href="https://www.service-public.fr/particuliers/vosdroits/F1169" target="_blank" rel="noopener">Recours DALO</a>
    </div>
  `;
  main.appendChild(links);

  const cerfa = document.createElement('div');
  cerfa.className='card';
  cerfa.innerHTML = `
    <h3>Formulaire Cerfa n°14069*05</h3>
    <p>Pour rester fiable, cette application ne remplit pas automatiquement le formulaire officiel (le champ exact du PDF gouvernemental peut changer d\u2019une version à l\u2019autre). À la place, voici une fiche récapitulative à partir de ton profil, à recopier sur le formulaire officiel.</p>
    <div class="btn-row">
      <a class="btn btn-ghost" href="https://www.service-public.fr/particuliers/vosdroits/R20359" target="_blank" rel="noopener">Télécharger le Cerfa officiel</a>
      <button class="btn btn-primary" id="btn-recap">Générer ma fiche récapitulative</button>
    </div>
    <div id="recap-area"></div>
  `;
  main.appendChild(cerfa);
  document.getElementById('btn-recap').addEventListener('click', ()=>{
    const el = document.getElementById('recap-area');
    const e = computeEligibilite(p);
    el.innerHTML = `
      <div class="paper-preview" style="margin-top:14px;">
        <h4>Fiche récapitulative — demande de logement social</h4>
        <p><b>Statut de séjour :</b> ${esc(labelFor(p.statut))}<br>
        <b>Situation de logement actuelle :</b> ${esc(labelFor(p.hebergement))}<br>
        <b>Activité professionnelle :</b> ${esc(labelFor(p.activite))}<br>
        <b>Situation familiale :</b> ${esc(labelFor(p.famille))}<br>
        <b>Taille du foyer :</b> ${p.taille} personne(s)<br>
        <b>Zone recherchée :</b> ${esc(labelFor(p.zone))}<br>
        <b>RFR déclaré :</b> ${p.rfr ? Number(p.rfr).toLocaleString('fr-FR')+' €' : 'non renseigné'}<br>
        <b>Diagnostic d\u2019éligibilité :</b> ${p.rfr ? esc(e.diag) : 'à calculer dans l\u2019onglet Éligibilité'}<br>
        <b>Cas particuliers :</b> ${p.casParticuliers.length ? p.casParticuliers.map(labelFor).join(', ') : 'aucun'}</p>
      </div>
      <div class="btn-row"><button class="btn btn-ghost" id="btn-print-recap">Imprimer cette fiche</button></div>
    `;
    const recapEl = el.querySelector('.paper-preview');
    recapEl.id='print-recap';
    document.getElementById('btn-print-recap').addEventListener('click', ()=>printOnly(recapEl));
  });
}
function labelFor(v){
  const dict = {
    francais:'Française / Français', ue:'Ressortissant·e UE/EEE', hors_ue_titre:'Hors UE, titre valide', hors_ue_demande:'Hors UE, demande en cours',
    locataire:'Locataire', proprietaire:'Propriétaire', heberge:'Hébergé·e par un tiers', foyer:'Foyer / structure collective', sans_domicile:'Sans domicile stable',
    salarie:'Salarié·e', independant:'Indépendant·e', sans_emploi:'Sans emploi', retraite:'Retraité·e', etudiant:'Étudiant·e', inactif:'Autre',
    seul:'Personne seule', couple:'En couple', famille_enfants:'Famille avec enfant(s)', famille_monoparentale:'Famille monoparentale', separe_recent:'Séparation récente',
    paris:'Paris et limitrophes', idf:'Île-de-France (hors Paris)', autres:'Autres régions',
    handicap:'Handicap', violences:'Violences conjugales/intrafamiliales', ue_recent:'UE/EEE < 5 ans', sans_papiers_regularisation:'Régularisation en cours',
  };
  return dict[v] || v || '—';
}
